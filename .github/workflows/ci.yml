name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Build and smoke test
    runs-on: ubuntu-latest
    env:
      # The engine tests stub the canvas and run in plain Node: no browser, no
      # window, nothing to download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build the renderer
        run: npm run build:ui

      - name: Smoke test the engine
        run: npm run smoke
